<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zoo Keeper Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo"></div>
        <h1>Zoo Keeper Application</h1>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="menu-block">
                <div class="menu-header">Products</div>
                <ul>
                    <li><a href="">Products</a></li>
                    <li><a href="">Services</a></li>
                    <li><a href="">Feedback</a></li>
                </ul>
            </div>
            
            <div class="menu-block">
                <div class="menu-header">Reports</div>
                <ul>
                    <li><a href="">Assigned Issues</a></li>
                    <li><a href="">Summary View</a></li>
                </ul>
            </div>

            <div class="menu-block">
                <div class="menu-header">Info</div>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Articles</a></li>
                    <li><a href="">About Us</a></li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <p class="intro-text">Please complete the form.</p>
            
            <form action="" method="POST">
                <fieldset>
                    <legend>Contact Details</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" placeholder="Иван Топорышкин" pattern="[А-Яа-яЁё\s-]+" title="Введите имя и фамилию на русском языке" required>
                        </div>
                        <div class="form-group">
                            <label>Telephone</label>
                            <input type="tel" placeholder="89955566893" pattern="^8[0-9]{10}$">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="smbody@mail.ru">
                        </div>
                        <div class="form-group">
                            <label>Web site</label>
                            <input type="text" placeholder="www.site.ru" pattern="https?://.+" title="Введите полный адрес сайта, начиная с http:// или https://" required>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Person Details</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Birthday</label>
                            <input type="text" value="11-11-2000" pattern="(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[0-2])-\d{4}">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Registration date</label>
                            <input type="text" value="02-06-2016" pattern="(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[0-2])-\d{4}">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>When did you first know you wanted to be a zoo-keeper?</label>
                            <textarea></textarea>
                        </div>
                    </div>

                    <div class="bottom-section">
                        <div class="checkbox-container">
                            <label>Pick Your Favorite Animals</label>
                            <div class="checkbox-group">
                                <label><input type="checkbox"> Dog</label>
                                <label><input type="checkbox"> Cat</label>
                                <label><input type="checkbox"> Turtle</label>
                                <label><input type="checkbox"> Fish</label>
                                <label><input type="checkbox"> Parrot</label>
                                <label><input type="checkbox"> Canary</label>
                            </div>
                        </div>
                        
                        <div class="color-group">
                            <label>Color of Pet</label>
                            <input type="color" value="#000000">
                        </div>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn">Submit</button>
                    <button type="reset" class="btn">Reset</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
